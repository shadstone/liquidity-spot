<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>{% block title %}Trading assistant{% endblock %} | Liquidity.spot</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a281b;color:#f4fbf7;font:16px/1.6 system-ui,sans-serif}main{max-width:850px;margin:5vh auto;padding:24px}section{padding:24px;border:1px solid #3d8260;border-radius:16px;background:#103524}h1{font-size:30px;line-height:1.2}h2{font-size:22px}h3{font-size:19px}p,dt{color:#d2e2d8}.eyebrow{color:#6ee2a6;text-transform:uppercase;font-size:13px;font-weight:700;letter-spacing:.08em}.card{margin:20px 0;padding:20px;border:1px solid #3d8260;border-radius:12px;background:#071c12}.warning{padding:14px;border:1px solid #866b2c;background:#453719;border-radius:8px}dt{margin-top:12px;font-size:14px}dd{margin:2px 0 0}code,dd,h2,h3{overflow-wrap:anywhere}.consent{display:flex;gap:12px;align-items:flex-start;margin:20px 0;padding:16px;border:1px solid #72af8b;border-radius:8px}input[type=checkbox]{flex-shrink:0;width:18px;height:18px;margin-top:4px;accent-color:#29b973}button{padding:12px 18px;background:#29b973;color:#071c12;border:0;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}.actions{display:flex;gap:18px;flex-wrap:wrap;align-items:center}a{color:#6ee2a6}textarea{width:100%;min-height:260px;background:#071c12;color:#f4fbf7;border:1px solid #72af8b;border-radius:8px;padding:14px;font:14px/1.5 ui-monospace,monospace;resize:vertical}.small{font-size:14px}a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid white;outline-offset:3px}@media(max-width:480px){main{padding:12px;margin:12px auto}section,.card{padding:16px}h1{font-size:26px}}
</style></head><body><main>{% block content %}{% endblock %}</main></body></html>
