name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall app.py config.py models.py routes services
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check agent guide copy and dismissal behavior
        run: node --test tests/test_agent_guide_js.cjs
